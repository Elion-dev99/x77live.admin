<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x77 Executive Dashboard</title>
    <link rel="stylesheet" href="./css/index.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-container">

        <!-- Home View -->
        <div id="view-home" class="view active">
            <header class="app-header">
                <div class="user-profile">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Avatar" class="avatar">
                    <div>
                        <span class="greeting">Welcome Back,</span>
                        <span class="username">Max John Doe</span>
                    </div>
                </div>
                <button class="icon-btn-ghost">
                    <i data-lucide="bell"></i>
                </button>
            </header>

            <!-- Metrics Grid -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="card-icon-wrapper">
                        <i data-lucide="users"></i>
                    </div>
                    <span class="card-label">Active Agents</span>
                    <span class="card-value" id="stat-active">--</span>
                    <button class="see-more-btn">See More <i data-lucide="arrow-right"></i></button>
                </div>
                <div class="metric-card">
                    <div class="card-icon-wrapper">
                        <i data-lucide="git-branch"></i>
                    </div>
                    <span class="card-label">Running Workflows</span>
                    <span class="card-value" id="stat-workflows">--</span>
                    <button class="see-more-btn">See More <i data-lucide="arrow-right"></i></button>
                </div>
                <div class="metric-card">
                    <div class="card-icon-wrapper">
                        <i data-lucide="check-square"></i>
                    </div>
                    <span class="card-label">Tasks Completed</span>
                    <span class="card-value" id="stat-tasks">--</span>
                    <button class="see-more-btn">See More <i data-lucide="arrow-right"></i></button>
                </div>
                <div class="metric-card">
                    <div class="card-icon-wrapper">
                        <i data-lucide="trending-up"></i>
                    </div>
                    <span class="card-label">Success Rate</span>
                    <span class="card-value" id="stat-rate">--</span>
                    <button class="see-more-btn">See More <i data-lucide="arrow-right"></i></button>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="section-container">
                <div class="section-header">
                    <h3>Quick Actions</h3>
                    <button class="view-all-btn">View all</button>
                </div>
                <div class="quick-actions-group">
                    <button class="action-chip">
                        <i data-lucide="plus"></i> Creative Agent
                    </button>
                    <button class="action-chip">
                        <i data-lucide="bar-chart-2"></i> View Analytics
                    </button>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="section-container">
                <div class="section-header">
                    <h3>Recent Activity</h3>
                    <button class="view-all-btn">View all</button>
                </div>
                <div class="activity-list" id="activity-list">
                    <!-- Dynamic Rendered -->
                </div>
            </div>
        </div>

        <!-- Agents View -->
        <div id="view-agents" class="view">
            <div class="view-header">
                <h2>Agents</h2>
                <div class="subtitle">Agents Content Area</div>
            </div>
        </div>

        <!-- Workflows View -->
        <div id="view-workflows" class="view">
            <div class="view-header">
                <h2>Workflows</h2>
                <div class="subtitle">Workflows Content Area</div>
            </div>
        </div>

        <!-- Activity View -->
        <div id="view-activity" class="view">
            <div class="view-header">
                <h2>Activity</h2>
                <div class="subtitle">Activity Content Area</div>
            </div>
        </div>

        <!-- Settings View -->
        <div id="view-settings" class="view">
            <div class="view-header">
                <h2>Settings</h2>
                <div class="subtitle">Settings Content Area</div>
            </div>
        </div>

    </div>

    <!-- Floating Navbar -->
    <nav class="navbar">
        <button class="nav-btn active" data-target="view-home">
            <i data-lucide="home"></i>
            <span>Home</span>
        </button>
        <button class="nav-btn" data-target="view-agents">
            <i data-lucide="users"></i>
            <span>Agents</span>
        </button>
        <button class="nav-btn" data-target="view-workflows">
            <i data-lucide="git-branch"></i>
            <span>Workflows</span>
        </button>
        <button class="nav-btn" data-target="view-activity">
            <i data-lucide="activity"></i>
            <span>Activity</span>
        </button>
        <button class="nav-btn" data-target="view-settings">
            <i data-lucide="settings"></i>
            <span>Settings</span>
        </button>
    </nav>

    <script type="module" src="./js/index.js"></script>
</body>
</html>
