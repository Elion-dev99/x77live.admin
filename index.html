<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x77live Admin - 認証システム</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f2f2f7;
        color: #1c1c1e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .card {
        background: #ffffff;
        padding: 2rem;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 400px;
      }
      .brand {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .brand h1 { font-size: 1.5rem; font-weight: 700; color: #000; }
      .brand p { font-size: 0.85rem; color: #8e8e93; margin-top: 4px; }

      /* タブ切替 */
      .tabs {
        display: flex;
        background: #eef0f4;
        padding: 4px;
        border-radius: 12px;
        margin-bottom: 1.5rem;
      }
      .tab-btn {
        flex: 1;
        padding: 0.6rem;
        border: none;
        background: transparent;
        font-size: 0.9rem;
        font-weight: 600;
        color: #636366;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn.active {
        background: #ffffff;
        color: #000000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }

      /* フォーム要素 */
      .form-group {
        display: none;
      }
      .form-group.active {
        display: block;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #3a3a3c;
        margin-bottom: 0.4rem;
      }
      input[type="text"] {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #d1d1d6;
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 1.2rem;
        outline: none;
        transition: border-color 0.2s;
      }
      input[type="text"]:focus {
        border-color: #007aff;
      }

      /* ボタン */
      .btn {
        width: 100%;
        padding: 0.9rem;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: opacity 0.2s;
      }
      .btn-primary { background-color: #007aff; color: #ffffff; }
      .btn-success { background-color: #34c759; color: #ffffff; }
      .btn:hover { opacity: 0.9; }

      /* ステータスメッセージ */
      .status {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 10px;
        font-size: 0.85rem;
        text-align: center;
        display: none;
      }
      .status.info { display: block; background: #e5f1ff; color: #0055b3; }
      .status.success { display: block; background: #e3f9e5; color: #1b7a28; }
      .status.error { display: block; background: #ffe5e5; color: #c5221f; }
    </style>
  </head>
  <body>

    <div class="card">
      <div class="brand">
        <h1>x77live Admin</h1>
        <p>Face ID パキー認証システム</p>
      </div>

      <!-- 切り替えタブ -->
      <div class="tabs">
        <button id="tabLogin" class="tab-btn active">ログイン</button>
        <button id="tabRegister" class="tab-btn">新規登録</button>
      </div>

      <!-- 1. ログインフォーム -->
      <div id="loginForm" class="form-group active">
        <label for="loginUser">ユーザー名</label>
        <input type="text" id="loginUser" placeholder="例: admin" value="admin" />

        <button id="btnDoLogin" class="btn btn-primary">
          Face ID でログイン
        </button>
      </div>

      <!-- 2. 新規登録フォーム -->
      <div id="registerForm" class="form-group">
        <label for="regUser">登録するユーザー名</label>
        <input type="text" id="regUser" placeholder="例: admin" value="admin" />

        <button id="btnDoRegister" class="btn btn-success">
          Face ID を登録して作成
        </button>
      </div>

      <!-- 通知エリア -->
      <div id="statusMsg" class="status"></div>
    </div>

    <script>
      // DOM要素の取得
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const statusMsg = document.getElementById('statusMsg');

      // タブ切り替え処理
      tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        hideStatus();
      });

      tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        hideStatus();
      });

      function showStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className = `status ${type}`;
      }

      function hideStatus() {
        statusMsg.style.display = 'none';
      }

      // ----------------------------------------------------
      // ■ 新規アカウント＆Face ID 登録処理
      // ----------------------------------------------------
      document.getElementById('btnDoRegister').addEventListener('click', async () => {
        const username = document.getElementById('regUser').value.trim();
        if (!username) {
          showStatus('ユーザー名を入力してください。', 'error');
          return;
        }

        showStatus('Face ID 登録画面を呼び出しています...', 'info');

        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);

          const createOptions = {
            publicKey: {
              challenge: challenge,
              rp: { name: "x77live Admin" },
              user: {
                id: new TextEncoder().encode(username),
                name: username,
                displayName: username
              },
              pubKeyCredParams: [{ alg: -7, type: "public-key" }], // ES256
              authenticatorSelection: {
                authenticatorAttachment: "platform", // iPhone本体（Face ID）を強制指定
                userVerification: "required",
                residentKey: "preferred"
              },
              timeout: 60000
            }
          };

          // iPhoneのFace IDダイアログ起動
          const credential = await navigator.credentials.create(createOptions);

          if (credential) {
            // 鍵情報をローカルに保存（ユーザー名紐付け）
            const credIdBase64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
            localStorage.setItem(`faceid_${username}`, credIdBase64);

            showStatus(`「${username}」のFace ID登録が完了しました！ログインタブからお試しください。`, 'success');
          }
        } catch (err) {
          console.error(err);
          showStatus('登録エラー: ' + err.message, 'error');
        }
      });

      // ----------------------------------------------------
      // ■ Face ID ログイン処理
      // ----------------------------------------------------
      document.getElementById('btnDoLogin').addEventListener('click', async () => {
        const username = document.getElementById('loginUser').value.trim();
        if (!username) {
          showStatus('ユーザー名を入力してください。', 'error');
          return;
        }

        const savedCredId = localStorage.getItem(`faceid_${username}`);
        if (!savedCredId) {
          showStatus(`「${username}」のFace IDが登録されていません。「新規登録」タブから先に登録を行ってください。`, 'error');
          return;
        }

        showStatus('Face ID 認証中...', 'info');

        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);

          const rawId = Uint8Array.from(atob(savedCredId), c => c.charCodeAt(0));

          const getOptions = {
            publicKey: {
              challenge: challenge,
              allowCredentials: [{
                id: rawId,
                type: 'public-key'
              }],
              userVerification: 'required',
              timeout: 60000
            }
          };

          // iPhoneのFace IDダイアログ起動
          const assertion = await navigator.credentials.get(getOptions);

          if (assertion) {
            showStatus(`ログイン成功！ようこそ、${username} 様。`, 'success');
          }
        } catch (err) {
          console.error(err);
          showStatus('ログインエラー: ' + err.message, 'error');
        }
      });
    </script>
  </body>
</html>
