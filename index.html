<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x77live Admin - 認証システム</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f2f2f7;
        color: #1c1c1e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .card {
        background: #ffffff;
        padding: 2rem;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 400px;
      }
      .brand {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .brand h1 { font-size: 1.5rem; font-weight: 700; color: #000; }
      .brand p { font-size: 0.85rem; color: #8e8e93; margin-top: 4px; }

      /* タブ切替 */
      .tabs {
        display: flex;
        background: #eef0f4;
        padding: 4px;
        border-radius: 12px;
        margin-bottom: 1.5rem;
      }
      .tab-btn {
        flex: 1;
        padding: 0.6rem;
        border: none;
        background: transparent;
        font-size: 0.9rem;
        font-weight: 600;
        color: #636366;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn.active {
        background: #ffffff;
        color: #000000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }

      /* フォーム要素 */
      .form-group {
        display: none;
      }
      .form-group.active {
        display: block;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #3a3a3c;
        margin-bottom: 0.4rem;
      }
      input[type="text"] {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #d1d1d6;
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 1.2rem;
        outline: none;
      }

      /* ボタン */
      .btn {
        width: 100%;
        padding: 0.9rem;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn-primary { background-color: #007aff; color: #ffffff; }
      .btn-success { background-color: #34c759; color: #ffffff; }
      .btn-danger { background-color: #ff3b30; color: #ffffff; margin-top: 1rem; }
      .btn:hover { opacity: 0.9; }

      /* 詳細エラー・通知エリア */
      .status {
        margin-top: 1.2rem;
        padding: 1rem;
        border-radius: 12px;
        font-size: 0.85rem;
        line-height: 1.4;
        display: none;
        text-align: left;
        word-break: break-all;
      }
      .status.info { display: block; background: #e5f1ff; color: #0055b3; border: 1px solid #b8daff; }
      .status.success { display: block; background: #e3f9e5; color: #1b7a28; border: 1px solid #c3e6cb; }
      .status.error { display: block; background: #fdf2f2; color: #9b1c1c; border: 1px solid #f8b4b4; }
      .error-title { font-weight: bold; margin-bottom: 4px; display: block; font-size: 0.9rem; }
      .error-detail { font-size: 0.75rem; opacity: 0.85; margin-top: 6px; }

      /* 画面遷移用：ダッシュボード画面（初期状態は非表示） */
      #dashboardScreen {
        display: none;
        text-align: center;
      }
      .welcome-badge {
        background: #e3f9e5;
        color: #1b7a28;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>

    <!-- 1. 認証画面（ログイン・登録） -->
    <div id="authScreen" class="card">
      <div class="brand">
        <h1>x77live Admin</h1>
        <p>Face ID パスキー認証システム</p>
      </div>

      <!-- タブ -->
      <div class="tabs">
        <button id="tabLogin" class="tab-btn active">ログイン</button>
        <button id="tabRegister" class="tab-btn">新規登録</button>
      </div>

      <!-- ログインフォーム -->
      <div id="loginForm" class="form-group active">
        <label for="loginUser">ユーザー名</label>
        <input type="text" id="loginUser" placeholder="例: admin" value="admin" />

        <button id="btnDoLogin" class="btn btn-primary">
          Face ID でログイン
        </button>
      </div>

      <!-- 新規登録フォーム -->
      <div id="registerForm" class="form-group">
        <label for="regUser">登録するユーザー名</label>
        <input type="text" id="regUser" placeholder="例: admin" value="admin" />

        <button id="btnDoRegister" class="btn btn-success">
          Face ID を登録して作成
        </button>
      </div>

      <!-- 通知・エラー表示BOX -->
      <div id="statusMsg" class="status"></div>
    </div>

    <!-- 2. 遷移先：管理画面（ログイン成功後に表示） -->
    <div id="dashboardScreen" class="card">
      <div class="welcome-badge">認証完了</div>
      <h1 style="font-size: 1.4rem; margin-bottom: 0.5rem;">ダッシュボード</h1>
      <p style="color: #666; font-size: 0.9rem; margin-bottom: 1.5rem;">
        ようこそ、<strong id="loggedInUser"></strong> 様
      </p>
      <p style="font-size: 0.85rem; color: #8e8e93; line-height: 1.5;">
        Face ID によるログイン処理および画面遷移が正常に完了いたしました。
      </p>

      <button id="btnLogout" class="btn btn-danger">
        ログアウト
      </button>
    </div>

    <script>
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const statusMsg = document.getElementById('statusMsg');

      const authScreen = document.getElementById('authScreen');
      const dashboardScreen = document.getElementById('dashboardScreen');
      const loggedInUser = document.getElementById('loggedInUser');
      const btnLogout = document.getElementById('btnLogout');

      // タブ切り替え
      tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        hideStatus();
      });

      tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        hideStatus();
      });

      // 状態メッセージ表示（エラー時は詳細を出力）
      function showStatus(title, message, type, errDetail = null) {
        statusMsg.className = `status ${type}`;
        let html = `<span class="error-title">${title}</span><div>${message}</div>`;
        if (errDetail) {
          html += `<div class="error-detail">詳細コード: ${errDetail}</div>`;
        }
        statusMsg.innerHTML = html;
      }

      function hideStatus() {
        statusMsg.className = 'status';
        statusMsg.style.display = 'none';
      }

      // 画面遷移関数（ログイン画面 ↔ ダッシュボード）
      function navigateToDashboard(username) {
        loggedInUser.textContent = username;
        authScreen.style.display = 'none';
        dashboardScreen.style.display = 'block';
      }

      btnLogout.addEventListener('click', () => {
        dashboardScreen.style.display = 'none';
        authScreen.style.display = 'block';
        hideStatus();
      });

      // ----------------------------------------------------
      // ■ 新規登録処理
      // ----------------------------------------------------
      document.getElementById('btnDoRegister').addEventListener('click', async () => {
        const username = document.getElementById('regUser').value.trim();
        if (!username) {
          showStatus('入力エラー', 'ユーザー名を入力してください。', 'error');
          return;
        }

        showStatus('処理中', 'Face ID 登録画面を呼び出しています...', 'info');

        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);

          const createOptions = {
            publicKey: {
              challenge: challenge,
              rp: { name: "x77live Admin" },
              user: {
                id: new TextEncoder().encode(username),
                name: username,
                displayName: username
              },
              pubKeyCredParams: [{ alg: -7, type: "public-key" }],
              authenticatorSelection: {
                authenticatorAttachment: "platform",
                userVerification: "required",
                residentKey: "required"
              },
              timeout: 60000
            }
          };

          const credential = await navigator.credentials.create(createOptions);

          if (credential) {
            const credIdBase64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
            localStorage.setItem(`faceid_${username}`, credIdBase64);

            showStatus('登録成功', `「${username}」のFace ID登録が完了しました！ログインタブに切り替えてログインをお試しください。`, 'success');
          }
        } catch (err) {
          console.error('Registration Error:', err);
          handleWebAuthnError(err, '登録');
        }
      });

      // ----------------------------------------------------
      // ■ ログイン処理（成功時に画面遷移）
      // ----------------------------------------------------
      document.getElementById('btnDoLogin').addEventListener('click', async () => {
        const username = document.getElementById('loginUser').value.trim();
        if (!username) {
          showStatus('入力エラー', 'ユーザー名を入力してください。', 'error');
          return;
        }

        const savedCredId = localStorage.getItem(`faceid_${username}`);
        if (!savedCredId) {
          showStatus('未登録エラー', `「${username}」のFace IDがこの端末に保存されていません。「新規登録」タブから先に登録を行ってください。`, 'error');
          return;
        }

        showStatus('処理中', 'Face ID 認証を実行しています...', 'info');

        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);

          const rawId = Uint8Array.from(atob(savedCredId), c => c.charCodeAt(0));

          const getOptions = {
            publicKey: {
              challenge: challenge,
              allowCredentials: [{
                id: rawId,
                type: 'public-key'
              }],
              userVerification: 'required',
              timeout: 60000
            }
          };

          const assertion = await navigator.credentials.get(getOptions);

          if (assertion) {
            // 認証成功 -> ダッシュボード画面へ移動
            navigateToDashboard(username);
          }
        } catch (err) {
          console.error('Login Error:', err);
          handleWebAuthnError(err, 'ログイン');
        }
      });

      // ----------------------------------------------------
      // ■ エラー詳細解析・表示関数
      // ----------------------------------------------------
      function handleWebAuthnError(err, actionName) {
        let title = `${actionName}エラー`;
        let msg = '予期せぬエラーが発生いたしました。';
        let detail = `${err.name}: ${err.message}`;

        if (err.name === 'NotAllowedError') {
          title = '認証キャンセルまたはタイムアウト';
          msg = 'Face ID 認証がキャンセルされたか、タイムアウトいたしました。もう一度お試しください。';
        } else if (err.name === 'InvalidStateError') {
          title = '登録済みエラー';
          msg = 'この端末・ユーザーにはすでに同一のキーが登録されている可能性がございます。';
        } else if (err.name === 'NotSupportedError') {
          title = '非対応端末・ブラウザ';
          msg = 'お使いの端末またはブラウザは Face ID 認証に対応しておりません。';
        }

        showStatus(title, msg, 'error', detail);
      }
    </script>
  </body>
</html>
