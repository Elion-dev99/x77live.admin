<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- スマホ最適化 -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover">

  <title>x77 Executive Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/index.css">

  <!-- アイコン（Lucide） -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA設定 -->
  <link rel="manifest" href="/manifest.json">

  <!-- Service Worker登録 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>

  <!-- Face ID ログインオーバーレイ専用CSS（元レイアウトに一切影響しないよう独立定義） -->
  <style>
    #faceid-login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0b12;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .fid-card {
      background: #141321;
      border: 1px solid #26243a;
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      color: #ffffff;
    }
    .fid-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #fff; }
    .fid-sub { font-size: 13px; color: #8e8ca8; margin-bottom: 24px; }
    
    .fid-tabs { display: flex; background: #0b0b12; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
    .fid-tab { flex: 1; padding: 10px; border: none; background: transparent; color: #8e8ca8; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .fid-tab.active { background: #9333ea; color: #ffffff; }

    .fid-field { text-align: left; margin-bottom: 18px; }
    .fid-field label { display: block; font-size: 12px; color: #8e8ca8; margin-bottom: 6px; font-weight: 600; }
    .fid-field input { width: 100%; padding: 12px 14px; background: #0b0b12; border: 1px solid #26243a; border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; box-sizing: border-box; }

    .fid-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #a855f7, #7e22ce); border: none; border-radius: 12px; color: #ffffff; font-size: 14px; font-weight: 700; cursor: pointer; }
    .fid-btn:active { opacity: 0.85; }

    .fid-msg { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 12px; display: none; text-align: left; line-height: 1.4; word-break: break-all; }
    .fid-msg.err { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
    .fid-msg.info { display: block; background: rgba(168, 85, 247, 0.15); border: 1px solid #a855f7; color: #d8b4fe; }
  </style>
</head>

<body>

  <!-- Face ID 認証画面 (オーバーレイ) -->
  <div id="faceid-login-overlay">
    <div class="fid-card">
      <div class="fid-title">x77 Executive</div>
      <div class="fid-sub">Face ID パスキー認証</div>

      <div class="fid-tabs">
        <button id="fidTabLogin" class="fid-tab active">ログイン</button>
        <button id="fidTabReg" class="fid-tab">新規登録</button>
      </div>

      <div id="fidBoxLogin">
        <div class="fid-field">
          <label>ユーザー名</label>
          <input type="text" id="fidUserLogin" value="admin">
        </div>
        <button id="fidBtnLogin" class="fid-btn">Face ID でログイン</button>
      </div>

      <div id="fidBoxReg" style="display: none;">
        <div class="fid-field">
          <label>登録ユーザー名</label>
          <input type="text" id="fidUserReg" value="admin">
        </div>
        <button id="fidBtnReg" class="fid-btn">Face ID を登録作成</button>
      </div>

      <div id="fidMsg" class="fid-msg"></div>
    </div>
  </div>


  <!-- 全画面を包むコンテナ（★元のコード100%完全そのまま★） -->
  <div class="container">

    <!-- ========================= -->
    <!-- Header（プロフィール＋通知） -->
    <!-- ========================= -->
    <header class="header">
      <div class="profile">
        <div class="avatar-wrap">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"
               alt="Avatar" class="avatar-img">
        </div>
        <div>
          <div class="profile-sub">Welcome Back,</div>
          <div class="profile-name">Max John Doe</div>
        </div>
      </div>

      <button class="icon-btn" aria-label="Notifications">
        <i data-lucide="bell" size="18"></i>
      </button>
    </header>


    <!-- ========================= -->
    <!-- 1. Home View（初期表示） -->
    <!-- ========================= -->
    <div class="view active" id="view-home">

      <!-- 2x2 グリッド統計 -->
      <section class="grid-2x2">

        <!-- Active Agents -->
        <div class="stat-card">
          <div class="card-icon"><i data-lucide="users" size="16"></i></div>
          <div class="card-label">Active Agents</div>
          <div class="card-value" id="stat-active">12</div>
          <button class="see-more-btn">See More <i data-lucide="arrow-right" size="10"></i></button>
        </div>

        <!-- Running Workflows -->
        <div class="stat-card">
          <div class="card-icon"><i data-lucide="workflow" size="16"></i></div>
          <div class="card-label">Running Workflows</div>
          <div class="card-value" id="stat-workflows">8</div>
          <button class="see-more-btn">See More <i data-lucide="arrow-right" size="10"></i></button>
        </div>

        <!-- Tasks Completed -->
        <div class="stat-card">
          <div class="card-icon"><i data-lucide="check-square" size="16"></i></div>
          <div class="card-label">Tasks Completed</div>
          <div class="card-value" id="stat-tasks">144</div>
          <button class="see-more-btn">See More <i data-lucide="arrow-right" size="10"></i></button>
        </div>

        <!-- Success Rate -->
        <div class="stat-card">
          <div class="card-icon"><i data-lucide="line-chart" size="16"></i></div>
          <div class="card-label">Success Rate</div>
          <div class="card-value" id="stat-rate">98%</div>
          <button class="see-more-btn">See More <i data-lucide="arrow-right" size="10"></i></button>
        </div>

      </section>


      <!-- Quick Actions -->
      <section class="section-block">
        <div class="section-header">
          <span class="section-title">Quick Actions</span>
          <a href="#" class="view-all">View all</a>
        </div>

        <div class="quick-actions-scroll">
          <button class="action-chip">
            <i data-lucide="plus" size="14"></i> Creative Agent
          </button>

          <button class="action-chip">
            <i data-lucide="bar-chart-2" size="14"></i> View Analytics
          </button>
        </div>
      </section>


      <!-- Recent Activity -->
      <section class="section-block">
        <div class="section-header">
          <span class="section-title">Recent Activity</span>
          <a href="#" class="view-all">View all</a>
        </div>

        <div class="activity-list" id="activity-list"></div>
      </section>

    </div> <!-- /view-home -->


    <!-- ========================= -->
    <!-- 2. Agents View -->
    <!-- ========================= -->
    <div class="view" id="view-agents">
      <section class="section-block">
        <div class="section-header">
          <span class="section-title">Agents</span>
        </div>
        <div class="placeholder-card">
          <div class="placeholder-text">Agents Content Area</div>
        </div>
      </section>
    </div>


    <!-- ========================= -->
    <!-- 3. Workflows View -->
    <!-- ========================= -->
    <div class="view" id="view-workflows">
      <section class="section-block">
        <div class="section-header">
          <span class="section-title">Workflows</span>
        </div>
        <div class="placeholder-card">
          <div class="placeholder-text">Workflows Content Area</div>
        </div>
      </section>
    </div>


    <!-- ========================= -->
    <!-- 4. Activity View -->
    <!-- ========================= -->
    <div class="view" id="view-activity">
      <section class="section-block">
        <div class="section-header">
          <span class="section-title">Activity</span>
        </div>
        <div class="placeholder-card">
          <div class="placeholder-text">Activity Content Area</div>
        </div>
      </section>
    </div>


    <!-- ========================= -->
    <!-- 5. Settings View -->
    <!-- ========================= -->
    <div class="view" id="view-settings">
      <section class="section-block">
        <div class="section-header">
          <span class="section-title">Settings</span>
        </div>
        <div class="placeholder-card">
          <div class="placeholder-text">Settings Content Area</div>
        </div>
      </section>
    </div>


    <!-- ===================================================== -->
    <!-- Bottom Floating Navbar（★ container の中に移動済み） -->
    <!-- ===================================================== -->
    <nav class="navbar" id="navbar">

      <!-- SPA画面切替ボタン -->
      <button class="nav-btn active" data-target="view-home">
        <i data-lucide="home" size="18"></i>
        <span class="nav-text">Home</span>
      </button>

      <button class="nav-btn" data-target="view-agents">
        <i data-lucide="users" size="18"></i>
        <span class="nav-text">Agents</span>
      </button>

      <button class="nav-btn" data-target="view-workflows">
        <i data-lucide="git-branch" size="18"></i>
        <span class="nav-text">Workflows</span>
      </button>

      <button class="nav-btn" data-target="view-activity">
        <i data-lucide="activity" size="18"></i>
        <span class="nav-text">Activity</span>
      </button>

      <button class="nav-btn" data-target="view-settings">
        <i data-lucide="settings" size="18"></i>
        <span class="nav-text">Settings</span>
      </button>

      <!-- ボタン押下イベント（events.jsで拾う） -->
      <button data-action="update-stock">更新</button>
      <button data-action="open-settings">設定</button>

    </nav>

  </div> <!-- /container -->


  <!-- 初期化JS（★元のスクリプトそのまま★） -->
  <script src="js/index.js"></script>

  <!-- Face ID 制御スクリプト（元コードに何の影響も与えない独立処理） -->
  <script>
    (function() {
      var overlay = document.getElementById('faceid-login-overlay');
      var tabLogin = document.getElementById('fidTabLogin');
      var tabReg = document.getElementById('fidTabReg');
      var boxLogin = document.getElementById('fidBoxLogin');
      var boxReg = document.getElementById('fidBoxReg');
      var msgBox = document.getElementById('fidMsg');

      tabLogin.addEventListener('click', function() {
        tabLogin.className = 'fid-tab active';
        tabReg.className = 'fid-tab';
        boxLogin.style.display = 'block';
        boxReg.style.display = 'none';
        msgBox.style.display = 'none';
      });

      tabReg.addEventListener('click', function() {
        tabReg.className = 'fid-tab active';
        tabLogin.className = 'fid-tab';
        boxReg.style.display = 'block';
        boxLogin.style.display = 'none';
        msgBox.style.display = 'none';
      });

      function showMsg(text, type) {
        msgBox.className = 'fid-msg ' + type;
        msgBox.textContent = text;
      }

      function unlock() {
        overlay.style.display = 'none';
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      // 新規登録
      document.getElementById('fidBtnReg').addEventListener('click', async function() {
        var user = document.getElementById('fidUserReg').value.trim();
        if (!user) return showMsg('ユーザー名を入力してください。', 'err');

        showMsg('Face ID 認証準備中...', 'info');
        try {
          var challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          var cred = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: "x77 Executive" },
              user: { id: new TextEncoder().encode(user), name: user, displayName: user },
              pubKeyCredParams: [{ alg: -7, type: "public-key" }],
              authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "required" },
              timeout: 60000
            }
          });
          if (cred) {
            var rawId = new Uint8Array(cred.rawId);
            var str = '';
            for (var i = 0; i < rawId.length; i++) str += String.fromCharCode(rawId[i]);
            localStorage.setItem('fid_' + user, btoa(str));
            showMsg('登録が完了しました。「ログイン」タブへ切り替えてログインをお試しください。', 'info');
          }
        } catch(e) {
          showMsg('登録に失敗しました: ' + (e.name === 'NotAllowedError' ? 'キャンセルされました' : e.message), 'err');
        }
      });

      // ログイン
      document.getElementById('fidBtnLogin').addEventListener('click', async function() {
        var user = document.getElementById('fidUserLogin').value.trim();
        if (!user) return showMsg('ユーザー名を入力してください。', 'err');

        var saved = localStorage.getItem('fid_' + user);
        if (!saved) return showMsg('登録されたFace IDが見つかりません。「新規登録」を行ってください。', 'err');

        showMsg('Face ID 照合中...', 'info');
        try {
          var challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          var bStr = atob(saved);
          var bytes = new Uint8Array(bStr.length);
          for (var i = 0; i < bStr.length; i++) bytes[i] = bStr.charCodeAt(i);

          var assertion = await navigator.credentials.get({
            publicKey: {
              challenge: challenge,
              allowCredentials: [{ id: bytes, type: 'public-key' }],
              userVerification: 'required',
              timeout: 60000
            }
          });

          if (assertion) {
            unlock();
          }
        } catch(e) {
          showMsg('ログインに失敗しました: ' + (e.name === 'NotAllowedError' ? 'キャンセルされました' : e.message), 'err');
        }
      });
    })();
  </script>

</body>
</html>
