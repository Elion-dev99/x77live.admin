<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x77 Executive Dashboard</title>
    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0813">
    <!-- CSS -->
    <link rel="stylesheet" href="css/index.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Main Views Container -->
        <main class="views-container">

            <!-- HOME / DASHBOARD VIEW (初期表示画面) -->
            <div class="view active" id="view-home">
                <!-- App Header -->
                <header class="app-header">
                    <div class="user-profile">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="avatar">
                        <div class="user-info">
                            <span class="greeting">Welcome Back,</span>
                            <h2 class="username">Max John Doe</h2>
                        </div>
                    </div>
                    <button class="icon-btn-ghost" data-action="notifications" aria-label="Notifications">
                        <i data-lucide="bell"></i>
                    </button>
                </header>

                <!-- Dynamic Dashboard Content -->
                <div id="dashboard-content"></div>
            </div>

            <!-- AGENTS VIEW -->
            <div class="view" id="view-agents">
                <header class="view-header">
                    <h2>Agents Management</h2>
                    <p class="subtitle">Active agent instances and status</p>
                </header>
                <div id="agents-content"></div>
            </div>

            <!-- WORKFLOWS VIEW -->
            <div class="view" id="view-workflows">
                <header class="view-header">
                    <h2>Workflows</h2>
                    <p class="subtitle">Automated pipeline configuration</p>
                </header>
                <div id="workflows-content"></div>
            </div>

            <!-- ACTIVITY VIEW -->
            <div class="view" id="view-activity">
                <header class="view-header">
                    <h2>System Activity</h2>
                    <p class="subtitle">Real-time action logs and events</p>
                </header>
                <div id="activity-content"></div>
            </div>

            <!-- SETTINGS VIEW -->
            <div class="view" id="view-settings">
                <header class="view-header">
                    <h2>Settings</h2>
                    <p class="subtitle">System and application parameters</p>
                </header>
                <div id="settings-content"></div>
            </div>

        </main>

        <!-- Navbar (app-container内に配置・仕様準拠) -->
        <nav class="navbar">
            <button class="nav-btn active" data-target="view-home" aria-label="Home">
                <i data-lucide="home"></i>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-target="view-agents" aria-label="Agents">
                <i data-lucide="users"></i>
            </button>
            <button class="nav-btn" data-target="view-workflows" aria-label="Workflows">
                <i data-lucide="git-fork"></i>
            </button>
            <button class="nav-btn" data-target="view-activity" aria-label="Activity">
                <i data-lucide="activity"></i>
            </button>
            <button class="nav-btn" data-target="view-settings" aria-label="Settings">
                <i data-lucide="settings"></i>
            </button>
        </nav>
    </div>

    <!-- Application Module Entry -->
    <script type="module" src="js/index.js"></script>
</body>
</html>
